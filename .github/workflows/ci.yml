name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "rsl-rl-lib==3.0.1" "onnxscript>=0.5" gymnasium numpy tensorboard pytest ruff import-linter
          pip install -e . --no-deps
      - name: Lint
        run: ruff check src scripts tests tools
      - name: Conventions (name uniqueness, registration path, file cap, comment policy)
        run: python tools/check_conventions.py
      - name: Import contracts
        run: lint-imports
      - name: Unit tests (no simulator)
        run: pytest tests -q

  # Simulator smoke tests need IsaacSim + IsaacLab and are run manually:
  #   GD_LAB_ISAAC_TESTS=1 pytest tests/test_smoke_isaac.py
