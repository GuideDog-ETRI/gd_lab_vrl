seed: 42
device: cuda:0
num_steps_per_env: 100
max_iterations: 50000
empirical_normalization: null
obs_groups:
  policy:
  - policy
  critic:
  - critic
clip_actions: null
save_interval: 100
experiment_name: vision_rbq10_dreamwaq/arm_4
run_name: ''
logger: wandb
neptune_project: isaaclab
wandb_project: gd_lab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: gd_lab.rl.runner:DreamwaqRunner
policy:
  class_name: gd_lab.teachers.bivt.actor_critic:DreamwaqVrlGatedActorCritic
  init_noise_std: 1.0
  noise_std_type: scalar
  actor_obs_normalization: true
  critic_obs_normalization: true
  actor_hidden_dims:
  - 512
  - 256
  - 128
  critic_hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  history_length: 5
  policy_term_dims:
  - 3
  - 3
  - 3
  - 12
  - 12
  - 12
  - 1
  velocity_target_slice: !!python/tuple
  - 45
  - 48
  actor_history_steps: 4
  cenet_latent_dim: 16
  cenet_encoder_hidden_dims:
  - 128
  - 64
  cenet_decoder_hidden_dims:
  - 64
  - 128
  cenet_beta: 1.0
  cenet_learning_rate: 0.001
  cenet_velocity_loss_coef: 1.0
  cenet_reconstruction_loss_coef: 1.0
  adaboot_enabled: true
  adaboot_min_updates: 10
  adaboot_ema: 0.8
  height_scan_start: 110
  terrain_latent_dim: 32
  terrain_encoder_hidden_channels: !!python/tuple
  - 8
  - 16
  height_scan_grid_shape: !!python/tuple
  - 11
  - 17
algorithm:
  class_name: gd_lab.rl.ppo:DreamwaqPPO
  num_learning_epochs: 5
  num_mini_batches: 4
  learning_rate: 0.001
  schedule: adaptive
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.01
  desired_kl: 0.01
  max_grad_norm: 1.0
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  rnd_cfg: null
  symmetry_cfg:
    use_data_augmentation: true
    use_mirror_loss: false
    data_augmentation_func: gd_lab.methods.dreamwaq.vrl_symmetry:mirror_vrl_observations
    mirror_loss_coeff: 0.0
  min_learning_rate: 3.0e-05
top5_min_spacing: 100
top5_min_platform_gap_mean_level: 8.0
