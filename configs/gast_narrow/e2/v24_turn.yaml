# E2 for GAST-Narrow v2.4 on onvlm2 (a6000): in-place turns (new suite `turn`) + the narrow / gap / stairs retention
# check, all on the v2.4 env (`task: v24`: 58 columns, turn tiles, rear Mid-360). Baseline = Hangang v2.3 it602.
# Design: docs/design/GAST_NARROW_V24_TURN_DESIGN.md section 8.
#   python3 scripts/gast_narrow/e2/run_e2.py configs/gast_narrow/e2/v24_turn.yaml [--only turn] [--models v23u602,v24t1]
# Run it AFTER the training on GPUs 0-2 has finished (never GPU 3). Replace the v24 model paths with the final Top-5
# (logs/gast/narrow_v24/<run>/best_top5/<it>_top<k>.pt); keep v23u602 as the baseline.
# The v2.4 env lays the tiles out differently from the v2 env (58 vs 44 columns), so compare models inside this table,
# not with the Hangang v2.3 E2 table.
name: v24_turn
task: v24
out_root: logs/e2
seed: 42
seconds: 20.0                 # episode length (every env contributes its first episode); 180 deg at 0.5 rad/s = 6.3 s

hardware:
  gpus: [0, 1, 2]             # onvlm2: GPU 3 is refused by run_e2.py
  e2_slots_per_gpu: 2
  e1_slots_per_gpu: 3
  sif: /data/users/bsseo/gd_lab_isaaclab.sif
  python: /data/users/bsseo/venv/bin/python

models:
  v23u602: checkpoints/gast_narrow/narrow_v23_gh200_20261029/v23_gh200_it602_top5.pt
  # Final Top-5 of narrow_v24h (v2.4d, 5120 x 100 envs, 800 updates, 2026-10-31); E2 run 10-31 04:34-07:xx.
  v24t1: logs/gast/narrow_v24/narrow_v24h_602_5120x100_800_20261031/best_top5/653_top1.pt
  v24t2: logs/gast/narrow_v24/narrow_v24h_602_5120x100_800_20261031/best_top5/372_top2.pt
  v24t3: logs/gast/narrow_v24/narrow_v24h_602_5120x100_800_20261031/best_top5/301_top3.pt
  v24t4: logs/gast/narrow_v24/narrow_v24h_602_5120x100_800_20261031/best_top5/598_top4.pt
  v24t5: logs/gast/narrow_v24/narrow_v24h_602_5120x100_800_20261031/best_top5/327_top5.pt

suites:
  turn:                       # in-place turn pockets (v24 only): tile closest to the target radius, actual radius decides turnable
    enabled: true
    directions: [right, left] # right = wz < 0 (the deployed direction), left
    angle_deg: 180.0
    rates: [0.5]              # rad/s; several values add /w<rate> cells
    envs: 48
    groups:
      - families: [narrow_turn_aisle, narrow_turn_vestibule, narrow_turn_vestibule_neg, narrow_turn_room, narrow_turn_room_neg]
        cases:                # slack = r - 0.46 - m; tiles inside +/-0.04 of the threshold are avoided
          - {name: wide,      radius: 0.75,  margin: 0.10}   # +0.19 turn   (elevator 1.5 x 1.6 m)
          - {name: vestibule, radius: 0.885, margin: 0.15}   # +0.28 turn   (door vestibule)
          - {name: subway,    radius: 0.60,  margin: 0.05}   # +0.09 turn   (subway aisle 1.2 m)
          - {name: edge_turn, radius: 0.56,  margin: 0.05}   # +0.05 turn   same tile as edge_stop, only m differs
          - {name: edge_stop, radius: 0.56,  margin: 0.15}   # -0.05 STOP
          - {name: alcove,    radius: 0.475, margin: 0.10}   # -0.085 STOP  (0.95 m alcove)
      - families: [narrow_turn_tight]
        cases:
          - {name: tight,     radius: 0.45,  margin: 0.10}   # -0.11 STOP   (always too tight)
  narrow:                     # v2 gdm-like command; width target -> closest tile; margin m pinned; forward and tail first
    enabled: true
    families: [narrow_corridor, narrow_door_pos, narrow_door_neg, narrow_bend_left, narrow_bend_right]
    directions: [forward, backward]   # backward only for passable cases (width >= 0.48 + 2 m)
    cases:
      - {name: pass_wide,   width: 0.80, margin: 0.10}
      - {name: pass_tight,  width: 0.66, margin: 0.05}
      - {name: block_margin, width: 0.66, margin: 0.15}   # same width as pass_tight: only m differs
      - {name: block_narrow, width: 0.52, margin: 0.10}
    envs: 32
  dead_end:
    enabled: true
    families: [narrow_dead_end]
    levels: [7, 14]
    margin: 0.10
    envs: 32
  gap:                        # retention: platform gap crossing, heading locked to +/-x, fixed speed
    enabled: true
    directions: [forward, backward]
    levels: [7, 11, 14]
    speeds: [0.5, 0.9]
    envs: 48
  stairs:                     # retention: straight flights
    enabled: true
    families: [pyramid_stairs, pyramid_stairs_inv, pyramid_stairs_wide, pyramid_stairs_inv_wide, pyramid_stairs_nose,
               pyramid_stairs_inv_nose]
    directions: [up, down]
    levels: [9, 14]
    speed: 0.8
    envs: 32
  terrain:
    enabled: false
    families: [hf_pyramid_slope, hf_pyramid_slope_inv, random_rough, ring_fence]
    levels: [14]
    direction: outward
    speed: 1.0
    envs: 32

conditions:                   # one Isaac run per model and condition; `rear` = rear Mid-360 on the tail (v24 env)
  nominal:     {enabled: true, lidar: both,   rear: true,  payload_kg: 5.0, push: false, stair_disturbance: false,
                suites: [turn, narrow, dead_end, gap, stairs]}
  mid360_rear: {enabled: true, lidar: mid360, rear: true,  payload_kg: 5.0, push: false, stair_disturbance: false,
                suites: [turn, narrow, dead_end]}          # the deployment assumption: head Mid-360 + rear Mid-360
  mid360_only: {enabled: true, lidar: mid360, rear: false, payload_kg: 5.0, push: false, stair_disturbance: false,
                suites: [turn, narrow, dead_end]}          # same without the rear sensor: its value
  lidar_off:   {enabled: true, lidar: "off",  rear: false, payload_kg: 5.0, push: false, stair_disturbance: false,
                suites: [gap, stairs]}
  disturbed:   {enabled: false, lidar: both,  rear: true,  payload_kg: 5.0, push: true,  stair_disturbance: true,
                suites: [gap, stairs]}

e1:
  enabled: false
  harness: /data/users/bsseo/gd_lab_vrl_worktrees/update136_e1rayir
  params_from: models136/d3906/params
  arms: [v25or, G]
  families: {gap: gap, stdown: stairs_inv, stup: pyramid_stairs}
  seeds: [42, 43, 44, 45]
  ir: [native]
  margin_obs: 0.0

report:
  baseline: v23u602           # retention metrics (gap, stairs) are compared with 602
  max_drop_pt: 1.0            # flag a model when a retention metric is more than this many points below the baseline
