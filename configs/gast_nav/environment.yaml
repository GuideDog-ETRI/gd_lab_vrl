supervisor_mode: shadow  # D-8 training; standalone/deployment ControlRuntime defaults enforce
seed: 42
physics_dt: 0.005
policy_decimation: 2
capture_period_s: 0.1
legacy_fraction: 0.25
scene_mix: {nav_corridor: 0.15, nav_door: 0.15, nav_turn_room: 0.20, nav_stair_landing: 0.25, legacy: 0.25}
commands:
  task_probabilities: {passage: 0.25, turn: 0.20, stairs: 0.20, stop_start: 0.10, legacy: 0.25}
  default_conditions_fraction: 0.30
  go_probability: 0.80
  minimum_cap_mps: 0.3
  resample_s: 5.0
  condition_change_probability: 0.1
  condition_rate_per_s: {y_off: 0.02, margin: 0.01, turn_cap: 0.1}
  stop_start_toggle_s: 2.5  # 2026-10-21: 1.0 s flipped go before the ~1 s deceleration finished (stop_start T 0.26)
  brake_distance_m: 0.5
  brake_deceleration_mps2: 0.5
  # UPDATE162 S1: commanded -0.3/-0.6/-1.0 -> measured -0.34/-0.61/-0.98 rad/s.
  # Simulation envelope; deployment runtime verification remains separate.
  simulation_turn_cap_radps: 1.0
inertia:
  enabled: true
  optional_scene_probability: 0.3
  acceleration_mps2: [0.6, 1.2]
  rare_acceleration_mps2: [1.8, 3.0]
  rare_probability: 0.05
  rise_s: [1.0, 2.0]
  hold_s: [1.0, 3.0]
  delay_s: [0.0, 0.5]
  lateral_amplitude_mps2: [0.0, 1.5]
  lateral_frequency_hz: [0.1, 2.0]
  jerk_max_mps3: 10.0
  gravity_bias_per_mps2: 0.01
  gravity_bias_limit: 0.05
  gravity_mps2: 9.81
sensors:
  lower_depth:
    enabled: true
    profile: vendor_new
    sampling_scale: 1  # canonical 80x45 pixels per camera; native source permits up to 8
  azimuth_count: 24
  elevation_count: 8
  elevation_deg: [-75.0, 75.0]
  front_mounts_m: [[0.30, 0.0, 0.22], [0.10, 0.0, 0.18]]
  rear_mounts_m: [[-0.31, 0.16, 0.10], [-0.31, -0.16, 0.10]]
  mount_jitter_m: 0.015
  angle_jitter_rad: 0.03
  max_range_m: 6.0
  fit_chunk: 128
  normal_min_points: 3
  support_body_radius_m: 0.45
  contact_threshold_n: 5.0
  support_normal_radius_m: 0.2
  support_min_scatter: 1.0e-6
  ray_max_distance_m: 6.0
rewards:
  stair_end_stop: 0.2
  stair_end_motion: -1.0
  stopped_yaw_rate_radps: 0.05
  progress: 1.0
  overspeed: -1.0
  clearance: -2.0
  offset: -1.0
  stop_success: 1.0
  false_stop: -1.0
  forbidden_entry: -2.0
  turn_tracking: -1.0
  reverse_rate: -1.0
  reverse_accumulation: -1.0
  turn_drift: -1.0
  stair_alignment: -1.0
  dwell_motion: -1.0
  contact: -5.0
  stopped_speed_mps: 0.05
  swept_width_m: 0.60  # measured (UPDATE162 S1, 3906 ARM4): forward 0.52, with lateral steps 0.60; margin extra
smoke:
  envs: 16
  steps: 200
  stage: B
  force_fault_steps: [80, 81]
  fault_env_id: 0
  reset_steps: [100]
  require_all_four_scenes: true
  optimizer_steps_allowed: 0
training:
  total_envs: 4096
  horizon: 100
  epochs: 5
  minibatches: 4
  learning_rate: 0.001
  checkpoint_interval: 250
  top_k: 5
  log_root: logs/gast/nav_v1

landing_sensor:
  flat_tolerance_m: 0.05
  descent_drop_m: 0.10
  slip_speed_mps: 0.15
observability:
  r1_static_history: false
  r2_unknown_components: false
  certification_ttl_s: 2.0
  unknown_fraction_limit: 0.10
  unknown_cluster_area_m2: 0.01
  self_body_margin_m: 0.02  # C2.3b current URDF collision projection only
  required_bands: [B1, B2]  # C2.3a: B3 remains a policy/map input, not unknown-stop evidence.
  unknown_hold_s: 3.0
  forward_m: 0.8
  turn_radius_m: 0.76  # measured body-shape turn radius 0.71 + allowed centre drift 0.05 (R5 gate); margin extra
  sdf_clip_m: 6.0
person_contact:
  force_threshold_n: 1.0
  max_contacts_per_prim: 32
  robot_links: [trunk, FL_hip, FL_thigh, FL_calf, FL_foot, FR_hip, FR_thigh, FR_calf, FR_foot, RL_hip, RL_thigh, RL_calf, RL_foot, RR_hip, RR_thigh, RR_calf, RR_foot]
