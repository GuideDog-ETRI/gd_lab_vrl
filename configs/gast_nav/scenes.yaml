# UPDATE160 scene dimensions and provisional geometric oracle settings.
terrain:
  size: [16.0, 12.0]
  levels: 10
  floor_thickness: 0.30
  wall_thickness: 0.12
  wall_height: [0.9, 2.2]
  profile_epsilon: 0.00001
  geometry_epsilon: 0.000001
  inertia_kinds: [nav_turn_room]
corridor:
  width: [0.5, 1.5]
  length: [1.2, 6.0]
  bend_deg: [0.0, 30.0]
  box_count: [0, 3]
  box_depth: [0.10, 0.25]
  box_length: [0.20, 0.45]
  box_height: [0.2, 0.6]
  approach_length: 0.8
  approach_width: 1.5
  pillar_probability: 0.35
  pillar_width: [0.10, 0.20]
door:
  width: [0.5, 1.4]
  thickness: [0.05, 0.3]
  height: [1.9, 2.2]
  threshold: [0.0, 0.03]
  gap: [0.0, 0.20]
  gap_offset: 0.65
  gap_depth: 0.70
  route_length: 6.0
  header_height: 0.12
turn_room:
  # UPDATE161: 3--5m workspace with clutter, NOT a shrinking rectangular room.
  width: [3.0, 5.0]
  length: [3.0, 5.0]
  obstacle_count: [4, 12]  # optional perimeter walls are separate
  chair_height: [0.4, 0.5]
  chair_depth: [0.18, 0.35]
  chair_length: [0.25, 0.60]
  pillar_height: [0.5, 1.2]
  pillar_width: [0.12, 0.28]
  block_height: [0.4, 1.2]
  block_width: [0.18, 0.45]
  block_depth: [0.18, 0.40]
  outer_wall_probability: 0.35
  spot_jitter_m: 0.05
  delta_easy_m: 0.30
  delta_hard_m: -0.10
  other_clearance_m: [0.05, 0.55]
  row_jitter_rad: 0.12
  row_offset_m: [-0.45, 0.45]
  cylinder_slot_distance_m: 1.15
  cylinder_path_half_length_m: 0.12
  route_clearance_m: 0.35
  placement_attempts: 256
  polygon_samples: 128

stairs:
  width: [1.2, 3.0]
  rise: [0.10, 0.20]
  run: [0.28, 0.38]
  steps: [3, 6]
  landing_length: [0.6, 2.0]
  approach_length: 0.8
  box_count: [0, 2]
  box_depth: [0.15, 0.30]
  box_length: [0.15, 0.24]
  box_height: [0.15, 0.4]
  rail_height: 0.8
  rail_thickness: 0.04
oracle:
  swept_width_m: 0.50  # PROVISIONAL: replace with measured gait envelope.
  turn_swept_radius_m: 0.65  # reviewer: knee radius ~0.60 + centre drift 0.05; margin EXTRA.
  margin_m: 0.10
  collision_height_m: 0.80  # Geometric proxy only, caller may override vertical span.
  epsilon_m: 0.000001
cylinder:
  radius: [0.20, 0.30]
  height: 1.7
  speed: [0.0, 0.8]
  pingpong_probability: 0.5
  robot_radius_m: 0.65  # same provisional whole-robot rotation envelope
  clearance_m: 0.05
  disabled_z_m: -100.0
  endpoint_epsilon_m: 0.000001
  sample_attempts: 64
  # UPDATE161: vehicle-frame acceleration -> person sway (tunable assumptions).
  sway_gain_s2: 0.08
  sway_cutoff_hz: 0.8
  sway_max_offset_m: 0.12
