# D-8: diagnostic/training thresholds, not validated deployment thresholds.
step_height_m: 0.04
step_pitch_rad: 0.04
same_height_m: 0.025
level_angle_rad: 0.06
confirm_s: 0.15
# 2026-10-19 user rule: stair stepping seen, then flat ground ahead at the four-foot level -> stop.
rule: ahead_flat          # ahead_flat | body (old: step + pitch then four feet level)
ahead_min_m: 0.20
ahead_max_m: 0.80
ahead_half_width_m: 0.20
ahead_min_points: 6
ahead_flat_m: 0.025       # height spread of the ground ahead
ahead_level_m: 0.03       # ahead ground vs current foot sole level
foot_radius_m: 0.03       # foot link centre -> sole (URDF foot sphere)
