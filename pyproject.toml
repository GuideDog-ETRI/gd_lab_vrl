[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gd-lab"
version = "0.1.0"
description = "RBQ10 quadruped locomotion training framework (IsaacLab + RSL-RL)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch",
    "tensordict>=0.7.0",
    "rsl-rl-lib==3.0.1",
    "gymnasium",
]

[project.optional-dependencies]
# Training-machine extras. IsaacSim 5.1.0 + IsaacLab 2.3.1 must be pre-installed
# in the environment; they are not pip-resolvable from here.
train = ["wandb", "trimesh", "inputs"]
dev = ["pytest", "ruff", "import-linter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line length is advisory; the 300-line file cap is the enforced limit
    "UP007",
]

[tool.ruff.lint.per-file-ignores]
# IsaacLab MDP idiom: SceneEntityCfg defaults in term signatures.
"src/gd_lab/mdp/**" = ["B008"]
"src/gd_lab/methods/**" = ["B008"]
# Entry scripts must launch the simulator app before importing isaaclab modules.
"scripts/*" = ["E402"]
"tests/test_smoke_isaac.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "gd_lab"

[[tool.importlinter.contracts]]
name = "layered architecture"
type = "layers"
layers = [
    "gd_lab.deploy",
    "gd_lab.tasks",
    "gd_lab.agents",
    "gd_lab.methods",
    "gd_lab.rl",
    "gd_lab.mdp",
    "gd_lab.robots | gd_lab.managers | gd_lab.devices",
    "gd_lab.core",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "rl is env-agnostic"
type = "forbidden"
source_modules = ["gd_lab.rl"]
forbidden_modules = ["gd_lab.methods", "gd_lab.tasks", "gd_lab.mdp", "gd_lab.agents"]

[[tool.importlinter.contracts]]
name = "methods do not know tasks or rl"
type = "forbidden"
source_modules = ["gd_lab.methods"]
forbidden_modules = ["gd_lab.tasks", "gd_lab.rl", "gd_lab.agents"]
